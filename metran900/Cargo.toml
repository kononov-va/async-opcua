[package]
name = "metran900"
version = "0.1.0"
edition = "2024"

[dependencies]
crc16 = "0.4.0"
daemonize = "0.5.0"
fork = "0.2.0"
log = { workspace = true }
env_logger = { workspace = true }
serialport = { version = "4.7.3", default-features = false }
tokio = "1.47.1"

async-opcua-client = { path = "../async-opcua-client", optional = true, version = "0.18.0" }
async-opcua-core = { path = "../async-opcua-core", version = "0.18.0" }
async-opcua-core-namespace = { path = "../async-opcua-core-namespace", optional = true, version = "0.18.0" }
async-opcua-crypto = { path = "../async-opcua-crypto", version = "0.18.0" }
async-opcua-nodes = { path = "../async-opcua-nodes", version = "0.18.0" }
async-opcua-types = { path = "../async-opcua-types", version = "0.18.0" }
async-opcua-server = { path = "../async-opcua-server", version = "0.18.0" }

[dependencies.async-opcua]
path = "../async-opcua"
features = ["all"]

[lints]
workspace = true
